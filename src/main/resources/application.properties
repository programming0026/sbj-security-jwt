spring.application.name=sbj-security-jwt
server.port=8080

# Firma de los JWT. IMPORTANTE: este valor es solo para desarrollo; en producción usa una variable de entorno (JWT_SECRET)
# con al menos 32 caracteres aleatorios y nunca la subas al repositorio.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.issuer=https://api.juniverse.com
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

server.error.include-message=never
server.error.include-stacktrace=never
